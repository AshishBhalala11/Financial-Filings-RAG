networks:
  app_net:
    driver: bridge

volumes:
  faiss_data:
  eval_logs:

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: filings_backend
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      - FAISS_INDEX_PATH=/app/data/faiss_index
      - EVAL_LOG_PATH=/app/logs/ragas_eval.jsonl
      - RERANK_LOG_PATH=/app/logs/rerank.jsonl
    volumes:
      - faiss_data:/app/data
      - eval_logs:/app/logs
    ports:
      - "8000:8000"
    networks:
      - app_net
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        INTERNAL_API_URL: http://backend:8000
    container_name: filings_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - app_net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
